name: ci

on: [pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amrutam
          POSTGRES_PASSWORD: amrutam
          POSTGRES_DB: amrutam_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U amrutam"
          --health-interval 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - "6379:6379"

    env:
      DATABASE_URL: postgresql+asyncpg://amrutam:amrutam@localhost:5432/amrutam_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test
      JWT_REFRESH_SECRET: test-refresh
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pip-audit

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Audit dependencies
        run: python -m pip_audit
        continue-on-error: true
