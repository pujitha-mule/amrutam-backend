services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: amrutam
      POSTGRES_DB: amrutam
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://amrutam:amrutam@db:5432/amrutam
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-change-me
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret
      ENV: dev
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://amrutam:amrutam@db:5432/amrutam
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-change-me
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret
      ENV: dev
    depends_on:
      db: { condition: service_healthy }
    command: python -m app.workers.outbox_worker
